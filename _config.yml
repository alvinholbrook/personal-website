title: Alvin Holbrook
description: "Writer & communications professional — stories, podcast appearances, and photography."
url: "https://alvinholbrook.github.io"
# TODO: baseurl must be "" once alvinholbrook.com is live (custom domain serves
# from root). While previewing at the github.io URL, it needs to match the repo
# name so internal links/assets resolve correctly. Also change `url` above to
# "https://alvinholbrook.com" at the same time.
baseurl: "/personal-website"

markdown: kramdown
theme: null
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Site-wide nav — edit labels/order here, not in each layout file
nav:
  - title: About
    url: /
  - title: Writing
    url: /writing/
  - title: Podcast Appearances
    url: /podcasts/
  - title: Photography
    url: /photography/
  - title: Contact
    url: /contact/

# Footer links — leave a URL blank ("") to hide that link
footer_links:
  linkedin: ""
  twitter: ""
  email: ""

# TODO: replace with your real contact email once decided
contact_email: "you@example.com"

# Files that exist for development/context but must never be published to the
# live site (CLAUDE.md in particular contains sensitive background — do not
# remove this exclusion).
exclude:
  - CLAUDE.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules

collections:
  stories:
    output: true
    permalink: /writing/:path/
  appearances:
    output: true
    permalink: /podcasts/:path/

defaults:
  - scope:
      path: ""
      type: "stories"
    values:
      layout: "story"
  - scope:
      path: ""
      type: "appearances"
    values:
      layout: "appearance"
