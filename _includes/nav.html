<header class="site-nav">
  <a class="site-nav-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <nav>
    <ul>
      {% for item in site.nav %}
      <li>
        <a href="{{ item.url | relative_url }}"
           {% if page.url == item.url %}aria-current="page"{% endif %}>
          {{ item.title }}
        </a>
      </li>
      {% endfor %}
    </ul>
  </nav>
</header>
